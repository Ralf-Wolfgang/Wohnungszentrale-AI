<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wohnungszentrale AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="screen">
    <header class="header">
      <div>
        <div class="place">⌂ Winhöring</div>
        <div class="date" id="dateLine">--</div>
        <div class="voice">▣ OK Google · Wohnung Befehle</div>
      </div>
      <div class="mic">▯</div>
    </header>

    <section class="weather-row">
      <article class="weather-card">
        <div class="weather-icon">▯</div>
        <div>
          <div class="card-title">PV-Prognose</div>
          <div class="card-value green">13,8 kWh</div>
          <div class="card-sub">Wetterlage: teils bewölkt</div>
        </div>
      </article>

      <article class="weather-card">
        <div class="weather-icon">▯</div>
        <div>
          <div class="card-title">Sonnenuntergang</div>
          <div class="card-value">21:18 Uhr</div>
          <div class="card-sub">Regenradar später</div>
        </div>
      </article>
    </section>

    <section class="sun-section">
      <div class="sun-wrap">
        <div class="sun"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
      </div>

      <div class="pv-power">1842,6 W</div>
      <div class="pv-label">PV-Erzeugung</div>
    </section>
  </main>

  <script>
    function updateTime() {
      const days = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
      const now = new Date();
      const day = days[now.getDay()];
      const date = now.toLocaleDateString("de-DE", {
        day: "2-digit", month: "2-digit", year: "numeric"
      });
      const time = now.toLocaleTimeString("de-DE", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      document.getElementById("dateLine").innerText = `${day} · ${date} · ${time}`;
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
